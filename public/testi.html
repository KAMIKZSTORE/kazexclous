<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#C9E5F7" />
<title>Testimoni — KAZE X CLOUD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='%232E7EA8'%3E%3Ccircle cx='24' cy='36' r='12'/%3E%3Ccircle cx='38' cy='29' r='15'/%3E%3Ccircle cx='49' cy='39' r='10'/%3E%3Crect x='14' y='33' width='40' height='15' rx='7.5'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#163B54;--ink2:#51708A;--accent:#1F6E9C;--card:rgba(255,255,255,.74)}
  body{font-family:'Zen Maru Gothic',sans-serif;color:var(--ink);overflow-x:hidden;
    background:linear-gradient(180deg,#C9E5F7 0%,#E4F3FC 55%,#F9FDFF 100%);-webkit-font-smoothing:antialiased}
  ::selection{background:#BFE0F3}
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  .sun{position:fixed;top:8%;left:7%;width:120px;height:120px;border-radius:50%;z-index:1;pointer-events:none;
    background:radial-gradient(circle,#FFF6DC 0%,rgba(255,246,220,.5) 42%,rgba(255,246,220,0) 70%)}
  .kanji{position:fixed;top:4%;right:-7%;z-index:1;pointer-events:none;user-select:none;font-weight:900;
    font-size:min(58vw,500px);line-height:1;color:rgba(31,110,156,.05);-webkit-text-stroke:1.5px rgba(31,110,156,.10)}
  .wrap{position:relative;z-index:2;max-width:480px;min-height:100vh;min-height:100svh;margin:0 auto;
    padding:20px 20px 44px;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:26px 0 30px}
  .reveal{animation:rise .8s var(--d,0s) cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes pulse{from{transform:scale(.45);opacity:1}to{transform:scale(1.4);opacity:0}}

  .icon-btn{width:46px;height:46px;border-radius:50%;cursor:pointer;display:grid;place-items:center;text-decoration:none;
    background:var(--card);border:1px solid rgba(255,255,255,.9);color:var(--accent);font-size:16px;
    box-shadow:0 10px 22px -12px rgba(23,74,110,.45);backdrop-filter:blur(10px);transition:transform .25s,background .25s,color .25s}
  .icon-btn:hover{background:var(--accent);color:#fff;transform:translateY(-2px)}
  .brand{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:900;letter-spacing:.26em;color:var(--accent)}
  .brand i{font-size:15px;animation:bob 4s ease-in-out infinite}

  .hero{text-align:center;background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:28px;
    padding:28px 20px 24px;box-shadow:0 18px 44px -20px rgba(23,74,110,.38);backdrop-filter:blur(16px) saturate(1.15)}
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.4em;color:#7FA5BF;padding-left:.4em}
  h1{font-weight:900;font-size:clamp(34px,9.5vw,46px);line-height:1.05;margin-top:6px}
  h1 span{color:var(--accent)}
  .jp{margin-top:8px;font-size:11.5px;font-weight:700;letter-spacing:.5em;padding-left:.5em;color:#7FA5BF}
  .pill-count{display:inline-flex;align-items:center;gap:9px;margin-top:16px;padding:7px 15px;border-radius:999px;
    background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.95);font-size:12.5px;font-weight:700;color:var(--ink2)}
  .dot{width:8px;height:8px;border-radius:50%;background:#2FA36B;position:relative;flex:none}
  .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(47,163,107,.5);animation:pulse 1.8s ease-out infinite}

  .back-all{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:16px;
    background:rgba(255,255,255,.85);border:1px solid rgba(31,110,156,.18);color:var(--ink);
    font-weight:900;font-size:14px;text-decoration:none;transition:.2s}
  .back-all:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}

  .grid{display:flex;flex-direction:column;gap:14px}
  .tcard{display:flex;gap:14px;padding:18px;border-radius:20px;background:var(--card);
    border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 28px -18px rgba(23,74,110,.4);
    backdrop-filter:blur(10px);transition:transform .25s}
  .tcard:hover{transform:translateY(-3px)}
  .ava{width:52px;height:52px;border-radius:16px;overflow:hidden;flex:none;display:grid;place-items:center;
    background:linear-gradient(160deg,#F2FAFE,#D6ECFA);border:1px solid #fff;color:var(--accent);
    font-weight:900;font-size:20px;box-shadow:0 8px 18px -10px rgba(23,74,110,.4)}
  .ava img{width:100%;height:100%;object-fit:cover}
  .body{flex:1;min-width:0}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .meta .who{display:flex;align-items:baseline;gap:8px;min-width:0}
  .meta b{font-size:15px}
  .meta span{font-size:10.5px;color:#8FB3CA;font-weight:700;letter-spacing:.04em;flex:none}
  .share{width:30px;height:30px;border-radius:9px;border:1px solid rgba(31,110,156,.18);background:#fff;
    color:var(--accent);cursor:pointer;font-size:12px;flex:none;display:grid;place-items:center;transition:.2s}
  .share:hover{background:var(--accent);color:#fff}
  .share:active{transform:scale(.9)}
  .stars{color:#E8A33D;font-size:11px;letter-spacing:2.5px;margin:3px 0 6px}
  .tcard p{font-size:13px;line-height:1.75;color:var(--ink2);word-wrap:break-word}

  .skel{height:112px;border-radius:20px;background:linear-gradient(100deg,#EAF4FB 40%,#F8FCFE 50%,#EAF4FB 60%);
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .empty{text-align:center;color:#8FB3CA;font-size:13px;font-weight:700;padding:30px 0;line-height:2;
    background:var(--card);border:1px dashed rgba(31,110,156,.25);border-radius:20px}
  .empty i{font-size:28px;display:block;margin-bottom:6px;color:#9FC3DB}

  footer{padding-top:6px;text-align:center}
  .web-pill{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;background:var(--accent);
    color:#fff;font-weight:700;font-size:13px;text-decoration:none;box-shadow:0 16px 30px -14px rgba(31,110,156,.65)}
  .web-pill:hover{background:#185C85}
  .credit{margin-top:13px;font-size:11px;letter-spacing:.14em;color:#8FB3CA}
  .toast{position:fixed;z-index:70;left:50%;bottom:30px;display:flex;align-items:center;gap:9px;
    transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;transition:opacity .35s,transform .35s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast i{color:#8FE3B4}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1}}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="sun" aria-hidden="true"></div>
<div class="kanji" aria-hidden="true">声</div>

<div class="wrap">
  <header class="reveal" style="--d:.05s">
    <a class="icon-btn" href="/" aria-label="Kembali ke beranda"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="brand"><i class="fa-solid fa-cloud"></i>KAZE X CLOUD</div>
  </header>

  <main>
    <section class="hero reveal" style="--d:.12s">
      <p class="eyebrow">STORE · KAZEX</p>
      <h1>TESTI<span>MONI</span></h1>
      <p class="jp">お客様の声</p>
      <span class="pill-count"><span class="dot"></span><span id="countTxt">Memuat…</span></span>
    </section>

    <!-- muncul hanya di mode share/link -->
    <a id="shareBar" class="back-all reveal" style="--d:.18s" href="/testi/store/kazex" hidden>
      <i class="fa-solid fa-arrow-left"></i>Kembali ke Semua Testi
    </a>

    <section id="list" class="grid" aria-live="polite">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </section>
  </main>

  <footer class="reveal" style="--d:.4s">
    <a class="web-pill" href="/"><i class="fa-solid fa-globe"></i>www.kazexnxx.my.id</a>
    <p class="credit">suara dari pelanggan kami — © KAZE X CLOUD</p>
  </footer>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  /* ===== Langit (versi ringan) ===== */
  const cv = document.getElementById('sky'), g = cv.getContext('2d');
  const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0;
  const rs = () => { const d = Math.min(devicePixelRatio||1,2); W = innerWidth; H = innerHeight;
    cv.width = W*d; cv.height = H*d; g.setTransform(d,0,0,d,0,0); };
  addEventListener('resize', rs); rs();
  function spr(){
    const w = 260 + Math.random()*160 | 0, h = 120 + Math.random()*60 | 0;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'), n = 8 + (Math.random()*4|0), base = h*.74;
    for(let i = 0; i < n; i++){
      const t = i/(n-1), px = w*.1 + t*w*.8, r = h*.14 + Math.sin(t*Math.PI)*h*.26 + Math.random()*h*.05;
      const py = base - r*.75 - Math.random()*h*.07;
      const gr = x.createRadialGradient(px,py,r*.2,px,py,r*1.35);
      gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.62,'rgba(255,255,255,.95)'); gr.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle = gr; x.beginPath(); x.arc(px,py,r*1.35,0,7); x.fill();
    }
    x.globalCompositeOperation = 'source-atop';
    const sh = x.createLinearGradient(0,h*.5,0,h);
    sh.addColorStop(0,'rgba(140,190,225,0)'); sh.addColorStop(1,'rgba(140,190,225,.4)');
    x.fillStyle = sh; x.fillRect(0,0,w,h);
    return c;
  }
  const cl = [];
  [{n:4,z:.4,a:.5,s:[.5,.8],v:[6,12],y:[.05,.42]},{n:3,z:.8,a:.72,s:[.95,1.35],v:[12,20],y:[.08,.55]}].forEach(L => {
    for(let i = 0; i < L.n; i++) cl.push({
      p: spr(), z: L.z, a: L.a, sc: L.s[0]+Math.random()*(L.s[1]-L.s[0]),
      x: Math.random()*(W+300)-150, y: H*(L.y[0]+Math.random()*(L.y[1]-L.y[0])),
      v: L.v[0]+Math.random()*(L.v[1]-L.v[0]), ph: Math.random()*7, amp: 3+Math.random()*5 });
  });
  let last = performance.now();
  function fr(t){
    const dt = Math.min(.05,(t-last)/1000); last = t; const tm = t/1000;
    const wind = Math.sin(tm*.18)*18;
    g.clearRect(0,0,W,H);
    for(const c of cl){
      c.x += (c.v + wind*c.z)*dt;
      const sw = c.p.width*c.sc, sh = c.p.height*c.sc;
      if(c.x > W+sw){ c.x = -sw - Math.random()*140; c.y = H*(.04+Math.random()*.5); }
      if(c.x < -sw-200){ c.x = W + Math.random()*120; }
      g.globalAlpha = c.a; g.drawImage(c.p, c.x, c.y + Math.sin(tm*.25+c.ph)*c.amp, sw, sh);
    }
    g.globalAlpha = 1;
    if(!rm) requestAnimationFrame(fr);
  }
  requestAnimationFrame(t => { last = t; fr(t); });

  /* ===== Data & render ===== */
  const list = document.getElementById('list');
  const countTxt = document.getElementById('countTxt');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Deteksi mode share: /share/link/testi/123... atau ?share= / ?code= / ...code=123...
  const qs = new URLSearchParams(location.search);
  const shareCode = qs.get('share') || qs.get('code') ||
    ((location.pathname.match(/code=(\d{6,})/) || [])[1] || '');

  const testiLink = code => location.origin + '/share/link/testi/' + code;

  let toastT;
  function toast(msg){
    const t = document.getElementById('toast');
    t.innerHTML = '<i class="fa-solid fa-check"></i>' + esc(msg);
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 2200);
  }
  async function copyLink(code){
    const text = testiLink(code);
    try{ await navigator.clipboard.writeText(text); }
    catch(_){
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      ta.remove();
    }
    toast('Link testimoni disalin');
  }
  list.addEventListener('click', e => {
    const b = e.target.closest('.share');
    if(b) copyLink(b.dataset.code);
  });

  function stars(r){
    let s = '';
    for(let i = 1; i <= 5; i++) s += '<i class="fa-' + (i <= r ? 'solid' : 'regular') + ' fa-star"></i>';
    return s;
  }
  function card(it, i){
    const d = new Date(it.time||0).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
    const ini = esc((it.name||'?').trim().charAt(0).toUpperCase());
    return '<article class="tcard reveal" style="--d:' + Math.min(.4, i*.08).toFixed(2) + 's">' +
      '<div class="ava" data-ini="' + ini + '">' +
        (it.img ? '<img src="' + esc(it.img) + '" alt="" loading="lazy">' : ini) +
      '</div>' +
      '<div class="body">' +
        '<div class="meta"><span class="who"><b>' + esc(it.name) + '</b><span>' + d + '</span></span>' +
          '<button class="share" data-code="' + esc(it.code) + '" title="Salin link testimoni" aria-label="Salin link testimoni"><i class="fa-solid fa-link"></i></button>' +
        '</div>' +
        '<div class="stars">' + stars(Math.abs(it.rating|0) || 5) + '</div>' +
        '<p>' + esc(it.desc) + '</p>' +
      '</div></article>';
  }

  function renderAll(items){
    countTxt.textContent = items.length + ' testimoni';
    if(!items.length){
      list.innerHTML = '<div class="empty"><i class="fa-regular fa-comment-dots"></i>Belum ada testimoni.<br>Segera hadir!</div>';
      return;
    }
    list.innerHTML = items.map(card).join('');
    list.querySelectorAll('.ava img').forEach(im => im.addEventListener('error', () => {
      const w = im.parentElement;
      w.textContent = w.dataset.ini || '★';
    }));
  }

  function renderOne(it){
    countTxt.textContent = 'Testimoni pilihan';
    list.innerHTML = card(it, 0);
    const im = list.querySelector('.ava img');
    if(im) im.addEventListener('error', () => { im.parentElement.textContent = im.parentElement.dataset.ini || '★'; });
  }

  function renderNotFound(){
    countTxt.textContent = 'Link tidak valid';
    list.innerHTML = '<div class="empty"><i class="fa-solid fa-link-slash"></i>' +
      'Testimoni dengan kode ini tidak ditemukan.<br>Mungkin sudah dihapus.</div>';
  }

  async function load(){
    try{
      const url = shareCode ? '/api/testi?code=' + encodeURIComponent(shareCode) : '/api/testi';
      const r = await fetch(url);
      const j = await r.json();
      if(shareCode){
        document.getElementById('shareBar').hidden = false;
        return j.ok && j.data && j.data.length ? renderOne(j.data[0]) : renderNotFound();
      }
      if(j && Array.isArray(j.data)) return renderAll(j.data);
      throw new Error(j && j.error ? j.error : 'Gagal memuat');
    }catch(err){
      countTxt.textContent = 'Gagal memuat';
      list.innerHTML = '<div class="empty"><i class="fa-solid fa-cloud-showers-heavy"></i>' +
        esc(err.message || 'Koneksi bermasalah.') + '<br>Coba muat ulang halaman.</div>';
    }
  }
  load();
})();
</script>
</body>
</html>
