<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Admin — KAZE X CLOUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#163B54;--ink2:#51708A;--accent:#1F6E9C}
  body{font-family:'Zen Maru Gothic',sans-serif;color:var(--ink);min-height:100vh;
    background:linear-gradient(180deg,#C9E5F7,#E4F3FC 55%,#F9FDFF);-webkit-font-smoothing:antialiased}
  body::before{content:"風";position:fixed;top:2%;right:-6%;font-weight:900;font-size:min(46vw,380px);
    line-height:1;color:rgba(31,110,156,.05);pointer-events:none;user-select:none}
  .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 18px;background:rgba(255,255,255,.7);backdrop-filter:blur(12px);border-bottom:1px solid rgba(31,110,156,.12)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.2em;font-size:12px;color:var(--accent)}
  .top nav{display:flex;gap:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;
    border:1px solid transparent;font:inherit;font-weight:900;font-size:13px;cursor:pointer;text-decoration:none;transition:.2s}
  .btn.solid{background:var(--accent);color:#fff}
  .btn.solid:hover{background:#185C85}
  .btn.ghost{background:rgba(255,255,255,.85);border-color:rgba(31,110,156,.18);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.danger:hover{border-color:#C0392B;color:#C0392B}
  .btn:disabled{opacity:.55;cursor:wait}
  .wrap{max-width:680px;margin:0 auto;padding:26px 18px 60px;display:flex;flex-direction:column;gap:18px}
  .card{background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.95);border-radius:20px;padding:22px;
    box-shadow:0 16px 36px -22px rgba(23,74,110,.4);backdrop-filter:blur(10px)}
  .card h2{font-size:15px;font-weight:900;letter-spacing:.06em;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:8px}
  label{display:block;font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--ink2);margin:14px 0 6px}
  input[type=text],select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(31,110,156,.22);
    background:#F7FBFE;font:inherit;font-size:14px;color:var(--ink);transition:border .2s,box-shadow .2s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,110,156,.15)}
  textarea{min-height:110px;resize:vertical}
  input[type=file]{font-size:13px;color:var(--ink2)}
  .hint{font-size:11.5px;color:#7FA5BF;margin-top:6px}
  .form-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid rgba(31,110,156,.12);
    background:rgba(255,255,255,.7);margin-top:10px}
  .row .thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:#E9F4FB;
    display:grid;place-items:center;font-weight:900;color:var(--accent);font-size:20px}
  .row .info{flex:1;min-width:0}
  .row .info b{font-size:14px}
  .row .stars{color:#E8A33D;font-size:11px;letter-spacing:1.5px;margin:2px 0}
  .row .info p{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .info small{font-size:10.5px;color:#8FB3CA}
  .row .info code{font-family:ui-monospace,monospace;background:#EAF4FB;padding:1px 6px;border-radius:6px}
  .row .ops{display:flex;gap:6px;flex:none}
  .iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid rgba(31,110,156,.18);
    background:#fff;color:var(--accent);cursor:pointer;font-size:12px;transition:.2s}
  .iconbtn:hover{background:var(--accent);color:#fff}
  .iconbtn.del:hover{background:#C0392B;border-color:#C0392B}
  .notice{display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:700}
  .notice.ok{background:#E5F6EC;color:#1F7A4D;border:1px solid #BCE5CC}
  .notice.err{background:#FDECEA;color:#B03A2E;border:1px solid #F5C6BD}
  .empty{text-align:center;color:#8FB3CA;font-size:13px;font-weight:700;padding:26px 0;line-height:2}
  .empty i{font-size:24px;display:block;margin-bottom:6px;color:#9FC3DB}
  .prev{width:100%;max-width:280px;aspect-ratio:16/10;object-fit:cover;border-radius:12px;
    border:1px solid rgba(31,110,156,.2);margin-top:8px;display:block}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;font-weight:700;color:#B03A2E;cursor:pointer}
  .chk input{width:16px;height:16px;accent-color:#C0392B}
  /* login */
  body.login{display:grid;place-items:center;padding:20px;min-height:100vh}
  .login-card{width:min(360px,100%);text-align:center;padding:34px 26px}
  .l-ico{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;
    background:linear-gradient(160deg,#F2FAFE,#D6ECFA);border:1px solid #fff;color:var(--accent);font-size:26px;
    box-shadow:0 12px 26px -14px rgba(23,74,110,.45)}
  .login-card h1{font-size:18px;letter-spacing:.14em}
  .sub{font-size:12px;color:#7FA5BF;margin:6px 0 4px}
  .wide{width:100%;margin-top:20px;padding:13px;border:0}
  .login-card label{text-align:left;margin-top:14px}
  .back{display:inline-block;margin-top:14px;font-size:11.5px;color:#8FB3CA;text-decoration:none}
  .back:hover{color:var(--accent)}
  .toast{position:fixed;z-index:70;left:50%;bottom:30px;display:flex;align-items:center;gap:9px;
    transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;transition:opacity .35s,transform .35s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast i{color:#8FE3B4}
  @media(max-width:520px){.row{flex-wrap:wrap}.row .ops{width:100%;justify-content:flex-end}}
</style>
</head>
<body>

<!-- ============ VIEW: LOGIN ============ -->
<div id="viewLogin" hidden>
  <form class="card login-card" id="loginForm" autocomplete="off">
    <div class="l-ico"><i class="fa-solid fa-cloud"></i></div>
    <h1>KAZE X ADMIN</h1>
    <p class="sub">Masuk untuk mengelola testimoni</p>
    <div id="loginErr"></div>
    <label for="u">USERNAME</label>
    <input id="u" type="text" name="username" required autofocus>
    <label for="p">PASSWORD</label>
    <input id="p" type="password" name="password" required>
    <button class="btn solid wide" id="loginBtn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
    <a class="back" href="/"><i class="fa-solid fa-arrow-left"></i> kembali ke beranda</a>
  </form>
</div>

<!-- ============ VIEW: PANEL ============ -->
<div id="viewPanel" hidden>
  <header class="top">
    <div class="brand"><i class="fa-solid fa-cloud"></i>KAZE X ADMIN</div>
    <nav>
      <a class="btn ghost" href="/testi/store/kazex" target="_blank"><i class="fa-solid fa-eye"></i> Lihat</a>
      <button class="btn ghost danger" id="logoutBtn" type="button"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
    </nav>
  </header>

  <main class="wrap">
    <div id="flash"></div>

    <section class="card">
      <h2 id="formTitle"><i class="fa-solid fa-plus-circle"></i>Tambah Testimoni</h2>
      <form id="itemForm">
        <label for="f-name">NAMA</label>
        <input id="f-name" type="text" required maxlength="60" placeholder="Nama pembeli / client">

        <label for="f-rate">RATING</label>
        <select id="f-rate">
          <option value="5">★★★★★ (5)</option>
          <option value="4">★★★★☆ (4)</option>
          <option value="3">★★★☆☆ (3)</option>
          <option value="2">★★☆☆☆ (2)</option>
          <option value="1">★☆☆☆☆ (1)</option>
        </select>

        <label for="f-desc">DESKRIPSI</label>
        <textarea id="f-desc" required maxlength="600" placeholder="Tulis isi testimoni…"></textarea>

        <label for="f-photo">FOTO <span id="photoHint" style="font-weight:700;color:#7FA5BF">(opsional)</span></label>
        <input id="f-photo" type="file" accept="image/*">
        <img id="photoPrev" class="prev" alt="Preview foto" hidden>
        <label class="chk" id="removePhotoWrap" hidden>
          <input type="checkbox" id="removePhoto"> Hapus foto saat ini
        </label>
        <p class="hint">JPG / PNG / WEBP · foto otomatis dikompres &amp; disimpan ke folder <b>/testi/</b></p>

        <div class="form-actions">
          <button class="btn solid" id="saveBtn" type="submit"><i class="fa-solid fa-plus"></i> Tambah Testimoni</button>
          <button class="btn ghost" id="cancelBtn" type="button" hidden><i class="fa-solid fa-xmark"></i> Batal</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2><i class="fa-solid fa-comments"></i>Daftar Testimoni <span id="cnt"></span></h2>
      <div id="rows"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i>Memuat…</div></div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let items = [];
  let editingId = null;
  let pendingPhoto = null;   // dataURL foto baru
  let removePhotoFlag = false;

  /* ---------- API ---------- */
  async function req(url, method, body){
    const opt = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) opt.body = JSON.stringify(body);
    const r = await fetch(url, opt);
    const j = await r.json().catch(() => ({}));
    return { status: r.status, ...j };
  }
  const api = {
    me:     ()   => req('/api/login', 'GET'),
    login:  b    => req('/api/login', 'POST', b),
    logout: ()   => req('/api/login', 'DELETE'),
    list:   ()   => req('/api/testi', 'GET'),
    add:    b    => req('/api/testi', 'POST', b),
    update: b    => req('/api/testi', 'PUT', b),
    del:    id   => req('/api/testi?id=' + encodeURIComponent(id), 'DELETE'),
  };

  /* ---------- util UI ---------- */
  let toastT;
  function toast(msg){
    const t = $('#toast');
    t.innerHTML = '<i class="fa-solid fa-check"></i>' + esc(msg);
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function flash(msg, type = 'ok'){
    $('#flash').innerHTML = msg
      ? '<div class="notice ' + type + '"><i class="fa-solid fa-' + (type === 'ok' ? 'circle-check' : 'triangle-exclamation') + '"></i>' + esc(msg) + '</div>'
      : '';
  }
  const testiLink = code => location.origin + '/share/link/testi/' + code;
  async function copyLink(code){
    const text = testiLink(code);
    try{ await navigator.clipboard.writeText(text); }
    catch(_){
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      ta.remove();
    }
    toast('Link share disalin');
  }

  /* ---------- kompres foto di browser ---------- */
  async function fileToDataUrl(file){
    if (file.size <= 200 * 1024){
      return await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
    }
    try{
      const bmp = await createImageBitmap(file);
      const max = 1100, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', .82);
    }catch(_){
      return await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
    }
  }

  /* ---------- routing login/panel ---------- */
  function showLogin(){
    $('#viewLogin').hidden = false; $('#viewPanel').hidden = true;
    document.body.classList.add('login');
  }
  function showPanel(){
    $('#viewLogin').hidden = true; $('#viewPanel').hidden = false;
    document.body.classList.remove('login');
  }
  async function route(){
    const me = await api.me().catch(() => ({ authed: false }));
    if (me.authed){
      showPanel();
      if (location.pathname !== '/admin/panel') history.replaceState({}, '', '/admin/panel');
      loadItems();
    } else {
      showLogin();
      if (location.pathname !== '/admin/login') history.replaceState({}, '', '/admin/login');
    }
  }
  addEventListener('popstate', route);

  /* ---------- login ---------- */
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#loginBtn');
    btn.disabled = true;
    $('#loginErr').innerHTML = '';
    const r = await api.login({ username: $('#u').value.trim(), password: $('#p').value });
    btn.disabled = false;
    if (r.ok && r.authed){
      history.pushState({}, '', '/admin/panel');
      showPanel(); loadItems();
    } else {
      $('#loginErr').innerHTML = '<div class="notice err" style="margin-top:12px"><i class="fa-solid fa-triangle-exclamation"></i>' +
        esc(r.error || 'Login gagal.') + '</div>';
    }
  });

  /* ---------- logout ---------- */
  $('#logoutBtn').addEventListener('click', async () => {
    await api.logout().catch(() => {});
    history.pushState({}, '', '/admin/login');
    showLogin();
  });

  /* ---------- daftar testimoni ---------- */
  async function loadItems(){
    $('#rows').innerHTML = '<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i>Memuat…</div>';
    const r = await api.list().catch(() => ({ ok: false, error: 'Koneksi gagal.' }));
    if (r.status === 401){ showLogin(); return; }
    if (!r.ok){
      $('#rows').innerHTML = '<div class="empty"><i class="fa-solid fa-cloud-showers-heavy"></i>' +
        esc(r.error || 'Gagal memuat.') + '</div>';
      return;
    }
    items = r.data || [];
    $('#cnt').textContent = '(' + items.length + ')';
    if (!items.length){
      $('#rows').innerHTML = '<div class="empty"><i class="fa-regular fa-folder-open"></i>Belum ada testimoni.<br>Tambahkan lewat form di atas.</div>';
      return;
    }
    $('#rows').innerHTML = items.map(it => {
      const d = new Date(it.time).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      const rate = Math.min(5, Math.max(1, it.rating || 5));
      return '<div class="row" data-id="' + esc(it.id) + '">' +
        (it.img ? '<img class="thumb" src="' + esc(it.img) + '" alt="">' :
                  '<span class="thumb">' + esc((it.name || '?').charAt(0).toUpperCase()) + '</span>') +
        '<div class="info"><b>' + esc(it.name) + '</b>' +
          '<div class="stars">' + '★'.repeat(rate) + '☆'.repeat(5 - rate) + '</div>' +
          '<p>' + esc(it.desc) + '</p>' +
          '<small>' + d + ' · kode <code>' + esc(it.code) + '</code></small>' +
        '</div>' +
        '<div class="ops">' +
          '<button class="iconbtn" data-act="copy" title="Salin link share"><i class="fa-solid fa-link"></i></button>' +
          '<button class="iconbtn" data-act="edit" title="Edit"><i class="fa-solid fa-pen"></i></button>' +
          '<button class="iconbtn del" data-act="del" title="Hapus"><i class="fa-solid fa-trash"></i></button>' +
        '</div></div>';
    }).join('');
  }

  $('#rows').addEventListener('click', async e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const id = b.closest('.row').dataset.id;
    const it = items.find(x => x.id === id);
    if (!it) return;

    if (b.dataset.act === 'copy') return copyLink(it.code);

    if (b.dataset.act === 'edit'){
      editingId = id;
      pendingPhoto = null; removePhotoFlag = false;
      $('#formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i>Edit Testimoni';
      $('#f-name').value = it.name; $('#f-rate').value = String(it.rating || 5);
      $('#f-desc').value = it.desc; $('#f-photo').value = '';
      $('#photoHint').textContent = '— biarkan kosong jika tetap pakai foto lama';
      const prev = $('#photoPrev');
      if (it.img){ prev.src = it.img; prev.hidden = false; }
      else prev.hidden = true;
      $('#removePhotoWrap').hidden = !it.img;
      $('#removePhoto').checked = false;
      $('#saveBtn').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan';
      $('#cancelBtn').hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    if (b.dataset.act === 'del'){
      if (!confirm('Hapus testimoni "' + it.name + '"?')) return;
      const r = await api.del(id);
      if (r.status === 401) return showLogin();
      if (r.ok){ toast('Testimoni dihapus'); loadItems(); }
      else flash(r.error || 'Gagal menghapus.', 'err');
    }
  });

  /* ---------- form foto ---------- */
  $('#f-photo').addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    pendingPhoto = await fileToDataUrl(f);
    removePhotoFlag = false; $('#removePhoto').checked = false;
    const prev = $('#photoPrev');
    prev.src = pendingPhoto; prev.hidden = false;
  });
  $('#removePhoto').addEventListener('change', e => {
    removePhotoFlag = e.target.checked;
    if (removePhotoFlag){ pendingPhoto = null; $('#f-photo').value = ''; $('#photoPrev').hidden = true; }
  });

  /* ---------- submit tambah/edit ---------- */
  $('#itemForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('#f-name').value.trim();
    const desc = $('#f-desc').value.trim();
    if (!name || !desc) return flash('Nama dan deskripsi wajib diisi.', 'err');

    const btn = $('#saveBtn');
    btn.disabled = true;
    const body = {
      name, desc,
      rating: parseInt($('#f-rate').value, 10) || 5,
    };
    if (editingId){
      body.id = editingId;
      if (pendingPhoto) body.photo = pendingPhoto;
      if (removePhotoFlag) body.removePhoto = true;
    } else if (pendingPhoto){
      body.photo = pendingPhoto;
    }

    const r = editingId ? await api.update(body) : await api.add(body);
    btn.disabled = false;

    if (r.status === 401) return showLogin();
    if (!r.ok) return flash(r.error || 'Gagal menyimpan.', 'err');

    flash(editingId ? 'Testimoni berhasil diperbarui.' : 'Testimoni berhasil ditambahkan.');
    resetForm(); loadItems();
  });

  function resetForm(){
    editingId = null; pendingPhoto = null; removePhotoFlag = false;
    $('#itemForm').reset();
    $('#photoPrev').hidden = true;
    $('#removePhotoWrap').hidden = true;
    $('#formTitle').innerHTML = '<i class="fa-solid fa-plus-circle"></i>Tambah Testimoni';
    $('#photoHint').textContent = '(opsional)';
    $('#saveBtn').innerHTML = '<i class="fa-solid fa-plus"></i> Tambah Testimoni';
    $('#cancelBtn').hidden = true;
  }
  $('#cancelBtn').addEventListener('click', resetForm);

  route();
})();
</script>
</body>
</html>
